name: Owner deployment
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    if: inputs.stage == 'dev' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner)
    environment: ${{ inputs.stage }}
    concurrency:
      group: contextia-deploy-${{ inputs.stage }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ github.sha }}
      CONTEXTIA_STAGE: ${{ inputs.stage }}
      AWS_REGION: ap-northeast-1
      AWS_EC2_METADATA_DISABLED: 'true'
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
      BEDROCK_MODEL_RESOURCES: ${{ vars.BEDROCK_MODEL_RESOURCES }}
      MAP_KEY_EXPIRE_TIME: ${{ vars.MAP_KEY_EXPIRE_TIME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          allowed-account-ids: '634512763705'
          role-to-assume: arn:aws:iam::634512763705:role/GitHub${{ inputs.stage == 'prod' && 'Prod' || 'Dev' }}DeployRole
      - name: Deploy selected stage
        run: pnpm "deploy:$CONTEXTIA_STAGE"
      - name: Public web/API smoke at the deployed SHA
        env:
          SMOKE_OUTPUTS_FILE: cdk.out/${{ inputs.stage }}/outputs.json
        run: pnpm "smoke:$CONTEXTIA_STAGE"
